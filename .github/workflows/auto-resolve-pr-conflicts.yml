name: Auto Resolve PR Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to resolve
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-resolve:
    # Only auto-resolve PRs from branches in this repository (not forks).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_json="$(gh pr view "${{ steps.pr.outputs.number }}" --json headRefName,mergeable,mergeStateStatus,headRepositoryOwner,isCrossRepository)"
          echo "head_ref=$(echo "$pr_json" | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
          echo "mergeable=$(echo "$pr_json" | jq -r '.mergeable')" >> "$GITHUB_OUTPUT"
          echo "merge_state=$(echo "$pr_json" | jq -r '.mergeStateStatus')" >> "$GITHUB_OUTPUT"
          echo "is_cross_repo=$(echo "$pr_json" | jq -r '.isCrossRepository')" >> "$GITHUB_OUTPUT"

      - name: Skip fork PRs
        if: steps.meta.outputs.is_cross_repo == 'true'
        run: |
          echo "Skipping auto-resolve for fork PRs (cannot push to external branches)."
          exit 0

      - name: Skip when already mergeable
        if: steps.meta.outputs.is_cross_repo != 'true' && steps.meta.outputs.merge_state == 'CLEAN' && steps.meta.outputs.mergeable == 'MERGEABLE'
        run: echo "PR is already mergeable with main. Nothing to resolve."

      - name: Checkout PR branch
        if: steps.meta.outputs.is_cross_repo != 'true' && (steps.meta.outputs.merge_state != 'CLEAN' || steps.meta.outputs.mergeable != 'MERGEABLE')
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main and keep PR changes on conflict
        if: steps.meta.outputs.is_cross_repo != 'true' && (steps.meta.outputs.merge_state != 'CLEAN' || steps.meta.outputs.mergeable != 'MERGEABLE')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains latest main."
            exit 0
          fi

          if git merge origin/main --no-edit; then
            echo "Merged main without conflicts."
          else
            echo "Conflicts detected. Keeping PR branch versions."
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              git checkout --ours "$file"
              git add "$file"
            done < <(git diff --name-only --diff-filter=U)
            git commit --no-edit -m "Auto-resolve merge conflicts with main (keep PR branch)"
          fi

          git push origin "HEAD:${{ steps.meta.outputs.head_ref }}"

      - name: Comment on PR
        if: steps.meta.outputs.is_cross_repo != 'true' && (steps.meta.outputs.merge_state != 'CLEAN' || steps.meta.outputs.mergeable != 'MERGEABLE')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --body \
            "Auto-resolved merge conflicts with \`main\` by keeping this PR branch's changes. Re-review if needed."
